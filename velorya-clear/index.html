let category='Alle',page='shop',search='',cart=JSON.parse(localStorage.getItem('bai_cart')||'{}'),demoOrders=JSON.parse(localStorage.getItem('bai_orders')||'[]'),admin=false;const money=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});const save=()=>{localStorage.setItem('bai_cart',JSON.stringify(cart));localStorage.setItem('bai_orders',JSON.stringify(demoOrders))};const total=()=>products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0);const app=document.getElementById('app');
function render(){let content='';if(page==='shop'){content=`<div class="hero"><img class="hero-mark" src="velorya-mark.svg" alt="VELORYA Markenzeichen"><div class="eyebrow">VELORYA · DIGITAL BUSINESS STUDIO</div><h1><em>Digitale Lösungen.</em><br>Für dein Business.</h1><p>Webdesign, KI-Tools und digitale Produkte. Klar präsentiert, einfach entdecken.</p><button class="cta" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Lösungen entdecken →</button></div><div class="section" id="catalog"><div><div class="muted">UNSERE LÖSUNGEN</div><h2>Produkte entdecken.</h2></div><div class="muted">${products.length} Angebote</div></div><div class="catalog-tools"><input aria-label="Produkte suchen" class="search" placeholder="Was suchst du?" value="${search.replaceAll('"','&quot;')}" oninput="search=this.value;render();document.querySelector('.search')?.focus()"><div class="filters">${['Alle','Webdesign','KI-Lösungen','Marketing','Dokumente'].map(c=>`<button class="filter ${category===c?'selected':''}" onclick="filterCategory('${c}')">${c}</button>`).join('')}</div></div><div class="grid">${products.filter(p=>(category==='Alle'||p.cat===category)&&(p.name+' '+p.cat).toLowerCase().includes(search.toLowerCase())).map(p=>`<article class="product"><div class="art">${artFor(p.id)}</div><div class="inside"><div class="tag">${p.cat}</div><h3>${p.name}</h3><div class="price">${money(p.price)}</div><button class="buy" onclick="add(${p.id})">Hinzufügen <span aria-hidden="true">↗</span></button></div></article>`).join('')}</div>`}else if(page==='cart'){content=`<div class="section"><h2>Warenkorb</h2><span class="muted">Demo</span></div><div class="panel">${Object.entries(cart).filter(([,q])=>q>0).length?products.filter(p=>cart[p.id]>0).map(p=>`<div class="line"><div><strong>${p.icon} ${p.name}</strong><div class="muted">${money(p.price)} pro Stück</div></div><div><button class="qty" onclick="change(${p.id},-1)">−</button> ${cart[p.id]} <button class="qty" onclick="change(${p.id},1)">+</button></div></div>`).join('')+`<div class="line"><strong>Gesamt</strong><strong>${money(total())}</strong></div><div class="notice">Nur Demo-Bestellung. Es erfolgt keine Zahlung, Lieferung oder verbindliche Bestellung.</div><button class="checkout" onclick="order()">Demo-Bestellung simulieren</button>`:'<div class="empty">🛍️<h3>Dein Warenkorb ist leer</h3>Entdecke unsere digitalen Angebote.</div>'}</div>`}else if(page==='orders'){content=`<div class="section"><h2>Bestellungen</h2><span class="muted">Lokal gespeichert</span></div><div class="panel">${demoOrders.length?demoOrders.map(o=>`<div class="line"><div><strong>Demo #${o.id}</strong><div class="muted">${o.date}</div></div><strong>${money(o.total)}</strong></div>`).join(''):'<div class="empty">📦<h3>Noch keine Demo-Bestellungen</h3></div>'}</div>`}else if(page==='admin'){content=`<div class="section"><h2>Business-Zentrale</h2><span class="pill">DEMO</span></div><div class="notice">VELORYA ist derzeit eine öffentliche, lokale Vorschau. Kein sicherer Admin-Login, keine echten Zahlungen, keine Serververbindung. Keine vertraulichen Daten eingeben.</div><div class="panel"><h2>Geschäftsübersicht</h2><div class="statgrid"><div class="stat"><small>Echter Umsatz</small><strong>0,00 €</strong></div><div class="stat"><small>Verfügbarer echter Gewinn</small><strong>0,00 €</strong></div><div class="stat"><small>Einkaufsbudget</small><strong>0,00 €</strong></div><div class="stat"><small>Demo-Bestellungen</small><strong>${demoOrders.length}</strong></div></div></div><div class="panel"><h2>KI-Agenten</h2>${[['Produktentwicklung','Konzept'],['Verkauf','Nicht verbunden'],['Zahlungsprüfung','Nicht verbunden'],['Wiederverkauf','Gesperrt']].map(x=>`<div class="line"><span>${x[0]}</span><strong class="muted">${x[1]}</strong></div>`).join('')}</div><div class="panel"><h2>Einkaufsregeln</h2><p>Produkte dürfen erst nach bestätigtem, tatsächlich verfügbarem Gewinn und nach Prüfung der Wiederverkaufsrechte eingekauft werden.</p><div class="line"><span>Automatischer Einkauf</span><strong>Aus</strong></div><div class="line"><span>Startkapital für Handel</span><strong>0,00 €</strong></div><div class="line"><span>Maximaler Anteil am Gewinn</span><strong>30 % (Planwert)</strong></div></div>`}app.innerHTML=`<header><div class="top"><div class="brand"><img src="velorya-mark.svg" alt="" width="34" height="34"> <span>VELORYA</span></div><button class="pill" onclick="go('admin')">Studio · Vorschau</button></div></header><main>${content}</main><nav class="nav" aria-label="Hauptnavigation">${[['shop','Start'],['cart','Warenkorb'],['orders','Bestellungen'],['admin','Studio']].map(([p,l])=>`<button type="button" aria-label="${l}" aria-current="${page===p?'page':'false'}" class="${page===p?'active':''}" onclick="go('${p}')"><span class="nav-icon">${({shop:`<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>`,cart:`<svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>`,orders:`<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`,admin:`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`})[p]}${p==='cart'&&Object.values(cart).some(x=>x>0)?'<i class="nav-dot"></i>':''}</span><span class="nav-label">${l}</span></button>`).join('')}</nav>`}
function filterCategory(c){category=c;render();document.getElementById('catalog')?.scrollIntoView({block:'start'})}function go(p){page=p;search='';render();scrollTo(0,0)}function add(id){cart[id]=(cart[id]||0)+1;save();go('cart')}function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);save();render()}function order(){if(!total())return;demoOrders.unshift({id:Date.now().toString().slice(-6),date:new Date().toLocaleString('de-DE'),total:total()});cart={};save();go('orders');alert('Demo-Bestellung gespeichert. Keine echte Zahlung oder Lieferung.')}render();
</script></body></html>
