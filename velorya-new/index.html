<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-title" content="VELORYA"><title>VELORYA v11 — Neue Vorschau</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#1d1d1f;background:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#ffffffdc;backdrop-filter:saturate(180%) blur(20px);z-index:5;border-bottom:1px solid #0000000b}.top{max-width:1120px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;font-size:19px;letter-spacing:2px}.brand b{color:#1d1d1f}.pill{border:1px solid #d2d2d7;background:#fff;color:#333;border-radius:100px;padding:9px 15px;font-size:12px;font-weight:650}main{max-width:1120px;margin:auto;padding:20px 18px 120px}.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 105%,#6655b6 0,#1d244a 30%,transparent 65%),linear-gradient(145deg,#07080f,#11182b);border-radius:28px;color:#fff;padding:60px 30px;margin:12px 0 42px;min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.hero:after{content:"";position:absolute;width:80%;height:110px;bottom:-85px;border-radius:50%;background:#a49cff;filter:blur(60px);opacity:.55}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:650;color:#b9b8ff}.hero h1{font-size:clamp(41px,7vw,76px);letter-spacing:-3px;line-height:1.05;margin:18px 0;max-width:780px;font-weight:750}.hero h1 em{font-style:normal;color:#e2e4ff}.hero p{color:#c5c8d4;max-width:540px;line-height:1.6;font-size:16px}.cta{background:#f5f5f7;color:#1d1d1f;border:0;padding:14px 24px;border-radius:100px;font-weight:650;width:max-content;margin-top:18px}.section{display:flex;align-items:end;justify-content:space-between;margin:32px 2px 20px}.section h2{font-size:clamp(25px,4vw,36px);letter-spacing:-1.2px;margin:0}.muted{color:#86868b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.product{background:#f5f5f7;border:1px solid #eeeef0;border-radius:22px;overflow:hidden;transition:transform .2s}.product:hover{transform:translateY(-3px)}.art{height:155px;display:grid;place-items:center;font-size:62px;background:radial-gradient(circle at 50% 90%,#dcdaf7,#f5f5f7 65%)}.product:nth-child(2n) .art{background:radial-gradient(circle at 50% 90%,#d9e9f9,#f5f5f7 65%)}.product .inside{padding:17px}.tag{color:#6e6e73;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px}.product h3{font-size:16px;line-height:1.35;min-height:44px;margin:10px 0}.price{font-size:21px;font-weight:750;margin:14px 0}.buy{border:0;background:#0071e3;color:white;border-radius:100px;padding:12px;width:100%;font-size:12px;font-weight:650}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;backdrop-filter:blur(20px);border-top:1px solid #e5e5e7;display:flex;justify-content:space-around;padding:11px 5px calc(11px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#86868b;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:650;min-width:66px}.nav button.active{color:#0071e3}.nav span{font-size:22px}.panel{background:#f5f5f7;border:1px solid #eee;border-radius:22px;padding:21px;margin-bottom:15px}.panel h2{margin:0 0 12px;font-size:22px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#fff;padding:18px;border-radius:17px}.stat strong{display:block;font-size:25px;margin-top:12px}.stat small{color:#86868b}.notice{background:#fff7e8;border:1px solid #f1dda6;padding:15px;border-radius:15px;color:#795817;font-size:13px;line-height:1.6;margin:14px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #dedee1;padding:15px 0}.line:last-child{border:0}.search{background:#f5f5f7;color:#1d1d1f;border:1px solid #e5e5e7;padding:16px 18px;border-radius:15px;width:100%;margin:0 0 18px;outline:none}.search:focus{border-color:#0071e3}.empty{text-align:center;color:#86868b;padding:45px 10px}.qty{background:#e5e5ea;padding:8px 12px;border-radius:10px;border:0}.checkout{background:#0071e3;color:#fff;border:0;padding:16px;border-radius:100px;width:100%;font-weight:700}.small{font-size:12px;color:#86868b;line-height:1.6}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.art{height:190px}.hero{padding:70px}.nav{max-width:600px;left:50%;transform:translateX(-50%);border-radius:22px 22px 0 0}}
.brand{display:flex;align-items:center;gap:9px;letter-spacing:2.4px}.brand img{border-radius:9px}.hero-mark{width:82px;height:82px;object-fit:contain;border-radius:20px;margin-bottom:17px;box-shadow:0 15px 50px #7665cc55}.hero{min-height:460px}.hero h1{font-weight:700}.product{box-shadow:0 6px 25px #11111108}.product .inside{padding:19px}.buy:hover,.checkout:hover{background:#005bb5}@media(min-width:700px){.hero-mark{width:100px;height:100px}}
</style></head><body><div id="app"></div><script>const products=[{id:1,name:'Premium Business Website',cat:'Webdesign',price:299,icon:'🌐',desc:'Modernes Website-Konzept mit mobiloptimiertem Design.'},{id:2,name:'KI-Terminassistent',cat:'KI-Lösungen',price:149,icon:'🤖',desc:'Konzept für einen intelligenten Terminservice.'},{id:3,name:'Social Media Studio',cat:'Marketing',price:79,icon:'✨',desc:'Content-Paket für professionelle Social-Media-Auftritte.'},{id:4,name:'Digitale Business-Vorlagen',cat:'Dokumente',price:29,icon:'📄',desc:'Vorlagen für Geschäftsabläufe und Planung.'},{id:5,name:'QR-Menü Design',cat:'Gastronomie',price:59,icon:'🍽️',desc:'Digitales Menü-Konzept für Restaurants.'},{id:6,name:'Marktanalyse Starter',cat:'Research',price:99,icon:'📈',desc:'Strukturierte Markt- und Wettbewerbsübersicht.'},{id:7,name:'Online-Kurs Starter',cat:'Lernen',price:89,icon:'🎓',desc:'Modulare Lernmaterialien und Kursstruktur.'},{id:8,name:'Branding & Werbemotive',cat:'Design',price:69,icon:'🎨',desc:'Konzeptpaket für visuelle Markenkommunikation.'}];
let page='shop',search='',cart=JSON.parse(localStorage.getItem('bai_cart')||'{}'),demoOrders=JSON.parse(localStorage.getItem('bai_orders')||'[]'),admin=false;const money=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});const save=()=>{localStorage.setItem('bai_cart',JSON.stringify(cart));localStorage.setItem('bai_orders',JSON.stringify(demoOrders))};const total=()=>products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0);const app=document.getElementById('app');
function render(){let content='';if(page==='shop'){content=`<div class="hero"><img class="hero-mark" src="velorya-mark.svg" alt="VELORYA Markenzeichen"><div class="eyebrow">VELORYA · DIGITAL BUSINESS STUDIO</div><h1><em>Digitale Lösungen.</em><br>Einfach außergewöhnlich.</h1><p>Premium-Digitallösungen für ambitionierte Unternehmen. Modernes Design, smarte Konzepte und ein klarer Blick nach vorn.</p><button class="cta" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Lösungen entdecken →</button></div><div class="section" id="catalog"><div><div class="muted">ENTDECKEN</div><h2>Für dein Business.</h2></div><div class="muted">${products.length} Angebote</div></div><input class="search" placeholder="Produkte suchen …" value="${search.replaceAll('"','&quot;')}" oninput="search=this.value;render()"><div class="grid">${products.filter(p=>(p.name+' '+p.cat).toLowerCase().includes(search.toLowerCase())).map(p=>`<article class="product"><div class="art">${p.icon}</div><div class="inside"><div class="tag">${p.cat}</div><h3>${p.name}</h3><div class="price">${money(p.price)}</div><button class="buy" onclick="add(${p.id})">Zum Warenkorb +</button></div></article>`).join('')}</div>`}else if(page==='cart'){content=`<div class="section"><h2>Warenkorb</h2><span class="muted">Demo</span></div><div class="panel">${Object.entries(cart).filter(([,q])=>q>0).length?products.filter(p=>cart[p.id]>0).map(p=>`<div class="line"><div><strong>${p.icon} ${p.name}</strong><div class="muted">${money(p.price)} pro Stück</div></div><div><button class="qty" onclick="change(${p.id},-1)">−</button> ${cart[p.id]} <button class="qty" onclick="change(${p.id},1)">+</button></div></div>`).join('')+`<div class="line"><strong>Gesamt</strong><strong>${money(total())}</strong></div><div class="notice">Nur Demo-Bestellung. Es erfolgt keine Zahlung, Lieferung oder verbindliche Bestellung.</div><button class="checkout" onclick="order()">Demo-Bestellung simulieren</button>`:'<div class="empty">🛍️<h3>Dein Warenkorb ist leer</h3>Entdecke unsere digitalen Angebote.</div>'}</div>`}else if(page==='orders'){content=`<div class="section"><h2>Bestellungen</h2><span class="muted">Lokal gespeichert</span></div><div class="panel">${demoOrders.length?demoOrders.map(o=>`<div class="line"><div><strong>Demo #${o.id}</strong><div class="muted">${o.date}</div></div><strong>${money(o.total)}</strong></div>`).join(''):'<div class="empty">📦<h3>Noch keine Demo-Bestellungen</h3></div>'}</div>`}else if(page==='admin'){content=`<div class="section"><h2>Business-Zentrale</h2><span class="pill">DEMO</span></div><div class="notice">VELORYA ist derzeit eine öffentliche, lokale Vorschau. Kein sicherer Admin-Login, keine echten Zahlungen, keine Serververbindung. Keine vertraulichen Daten eingeben.</div><div class="panel"><h2>Geschäftsübersicht</h2><div class="statgrid"><div class="stat"><small>Echter Umsatz</small><strong>0,00 €</strong></div><div class="stat"><small>Verfügbarer echter Gewinn</small><strong>0,00 €</strong></div><div class="stat"><small>Einkaufsbudget</small><strong>0,00 €</strong></div><div class="stat"><small>Demo-Bestellungen</small><strong>${demoOrders.length}</strong></div></div></div><div class="panel"><h2>KI-Agenten</h2>${[['Produktentwicklung','Konzept'],['Verkauf','Nicht verbunden'],['Zahlungsprüfung','Nicht verbunden'],['Wiederverkauf','Gesperrt']].map(x=>`<div class="line"><span>${x[0]}</span><strong class="muted">${x[1]}</strong></div>`).join('')}</div><div class="panel"><h2>Einkaufsregeln</h2><p>Produkte dürfen erst nach bestätigtem, tatsächlich verfügbarem Gewinn und nach Prüfung der Wiederverkaufsrechte eingekauft werden.</p><div class="line"><span>Automatischer Einkauf</span><strong>Aus</strong></div><div class="line"><span>Startkapital für Handel</span><strong>0,00 €</strong></div><div class="line"><span>Maximaler Anteil am Gewinn</span><strong>30 % (Planwert)</strong></div></div>`}app.innerHTML=`<header><div class="top"><div class="brand"><img src="velorya-mark.svg" alt="" width="34" height="34"> <span>VELORYA</span></div><button class="pill" onclick="go('admin')">Studio · Vorschau</button></div></header><main>${content}</main><nav class="nav">${[['shop','⌂','Shop'],['cart','▣','Warenkorb'],['orders','▤','Bestellungen'],['admin','◈','Studio']].map(([p,i,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${l}${p==='cart'&&Object.values(cart).some(x=>x>0)?' •':''}</button>`).join('')}</nav>`}
function go(p){page=p;search='';render();scrollTo(0,0)}function add(id){cart[id]=(cart[id]||0)+1;save();go('cart')}function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);save();render()}function order(){if(!total())return;demoOrders.unshift({id:Date.now().toString().slice(-6),date:new Date().toLocaleString('de-DE'),total:total()});cart={};save();go('orders');alert('Demo-Bestellung gespeichert. Keine echte Zahlung oder Lieferung.')}render();
</script></body></html>
